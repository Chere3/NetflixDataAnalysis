name: Data Quality

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dataset validator
        run: python scripts/validate_dataset.py

      - name: Generate quality report
        run: python scripts/generate_quality_report.py

      - name: Upload quality report artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-data-quality-report
          path: reports/data-quality-report.md
